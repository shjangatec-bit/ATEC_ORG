<!doctype html><html lang="ko"><head><meta charset="utf-8"><script>try{var t=localStorage.getItem("atec.theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>조직 운영계획</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 도구줄 + 요약띠, 아래는 조직도 캔버스(좌)와 편집 패널(우). 좁은 화면에서는 위아래로 쌓임 */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f6f7fa; --ink:#1a2130; --muted:#5b6475; --line:#c3c9d4; --line2:#e2e5eb;
  --band:#25304a; --band-ink:#ffffff; --band-sub:#c9d1e3;
  --accent:#c4004b; --accent-soft:#fbe6ee; --accent-ink:#ffffff;
  --chg:#a05f00; --chg-soft:#fff1d6; --out:#6b7280;
  --j-sales:#2f5fd0; --j-office:#6b7488; --j-rnd:#0f8a7e; --j-tech:#c47a00;
  --ok:#1f7a4d; --warn:#b54708;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#1a1f28; --surface2:#151920; --ink:#e6e9ef; --muted:#9aa3b3; --line:#3d4555; --line2:#2a303c;
  --band:#34436a; --band-ink:#ffffff; --band-sub:#c3cce0;
  --accent:#ff4f8e; --accent-soft:#3b1828; --accent-ink:#1a0710;
  --chg:#f0b041; --chg-soft:#3a2c10; --out:#9aa3b3;
  --j-sales:#7aa2ff; --j-office:#a3abbd; --j-rnd:#4fd1c0; --j-tech:#f0b041;
  --ok:#5ad39a; --warn:#f6a35b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1a1f28; --surface2:#151920; --ink:#e6e9ef; --muted:#9aa3b3; --line:#3d4555; --line2:#2a303c;
  --band:#34436a; --band-ink:#ffffff; --band-sub:#c3cce0;
  --accent:#ff4f8e; --accent-soft:#3b1828; --accent-ink:#1a0710;
  --chg:#f0b041; --chg-soft:#3a2c10; --out:#9aa3b3;
  --j-sales:#7aa2ff; --j-office:#a3abbd; --j-rnd:#4fd1c0; --j-tech:#f0b041;
  --ok:#5ad39a; --warn:#f6a35b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
header{background:var(--surface);border-bottom:1px solid var(--line2);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:10px;height:10px;background:var(--accent);border-radius:2px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--line2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input:not([type]),textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:5px 8px;min-width:0}
#scen{max-width:190px}
#sname{width:180px}
.status{font-size:12px;color:var(--muted);margin-left:auto}
.status.err{color:var(--accent)}
.strip{background:var(--surface2);border-bottom:1px solid var(--line2);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.sumline{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.facts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:600}
.delta-up{color:var(--ok)} .delta-dn{color:var(--accent)}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-left:auto}
.lg{display:inline-flex;align-items:center;gap:4px}
.sw{width:14px;height:10px;border-radius:2px;border:1px solid var(--line);display:inline-block}
.sw.band{background:var(--band);border-color:var(--band)} .sw.chg{background:var(--chg-soft);border-color:var(--chg)} .sw.new{background:var(--accent-soft);border-color:var(--accent)} .sw.out{border-style:dashed;border-color:var(--out)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.rk{font-size:10.5px;color:var(--muted);margin-right:2px}
.chip.hit .rk{color:inherit}
body.present #scen,body.present #sname,body.present #b-dup,body.present #b-new,body.present #b-del,body.present #b-exp,body.present #b-imp,body.present #b-hr,body.present #b-hc,body.present #b-pub,body.present #b-logout,body.present #b-present,body.present #q,body.present .sep,body.present #status,body.present .strip .btn,body.present aside,body.present #tray{display:none!important}
body.present main{grid-template-columns:minmax(0,1fr)}
body.present .canvas{height:auto}
.comp td.n,.comp th.n{min-width:30px}
.canvas{display:flex;flex-direction:column;min-height:0;min-width:0}
.scroll{flex:1;overflow:auto;min-height:0}
.tree{width:max-content;margin:0 auto;padding:22px 24px 40px}
.root-wrap{display:flex;justify-content:center;position:relative}
.root-wrap.has-kids{padding-bottom:18px}
.root-wrap.has-kids::after{content:"";position:absolute;bottom:0;left:50%;height:18px;border-left:1.5px solid var(--line)}
.cols{display:flex;gap:14px;align-items:flex-start;justify-content:center}
.col{position:relative;padding-top:18px;width:178px;display:flex;flex-direction:column}
.col::before{content:"";position:absolute;top:0;left:-7px;right:-7px;border-top:1.5px solid var(--line)}
.col:first-child::before{left:50%} .col:last-child::before{right:50%}
.col:only-child::before{display:none}
.col::after{content:"";position:absolute;top:0;left:50%;height:18px;border-left:1.5px solid var(--line)}
.kids{margin-left:12px;padding-left:12px;border-left:1.5px solid var(--line);display:flex;flex-direction:column;gap:8px;padding-top:8px}
.sub{position:relative;display:flex;flex-direction:column}
.sub::before{content:"";position:absolute;left:-12px;top:17px;width:12px;border-top:1.5px solid var(--line)}
.unit{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;user-select:none}
.unit.lv-root{min-width:220px}
.unit .band{padding:6px 9px}
.unit.big .band{background:var(--band);color:var(--band-ink);border-radius:4px 4px 0 0}
.unit.big:not(:has(.chips)) .band{border-radius:4px}
.unit.big .u-head{color:var(--band-sub)}
.u-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.u-name{font-weight:700;font-size:13px;letter-spacing:-.01em;overflow-wrap:anywhere}
.u-cnt{font-family:var(--f-num);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.9}
.u-cnt i{font-style:normal;font-family:var(--f-ui);font-size:11px;opacity:.85}
.u-head{font-size:12px;color:var(--muted);margin-top:1px}
.unit.st-chg{border-color:var(--chg);background:var(--chg-soft)}
.unit.st-new{border-color:var(--accent);background:var(--accent-soft)}
.unit.st-out{border-style:dashed;border-color:var(--out)}
.unit.big.st-chg .band{background:var(--chg);color:#fff} .unit.big.st-chg .u-head{color:#fff3dd}
.unit.big.st-new .band{background:var(--accent);color:var(--accent-ink)} .unit.big.st-new .u-head{color:var(--accent-ink);opacity:.85}
.unit.sel{box-shadow:0 0 0 3px var(--accent)}
.unit.dz-into{outline:2px dashed var(--accent);outline-offset:3px}
.unit.dz-before::before,.unit.dz-after::after{content:"";position:absolute;background:var(--accent);border-radius:2px}
.lv-team.dz-before::before{left:0;right:0;top:-6px;height:3px} .lv-team.dz-after::after{left:0;right:0;bottom:-6px;height:3px}
.lv-div.dz-before::before,.l1.dz-before::before{top:0;bottom:0;left:-9px;right:auto;height:auto;width:3px} .lv-div.dz-after::after,.l1.dz-after::after{top:0;bottom:0;right:-9px;left:auto;height:auto;width:3px}
.col-spacer{align-self:center;width:0;border-left:1.5px solid var(--line)}
.dtag{position:absolute;top:-9px;right:6px;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:9px;line-height:17px;z-index:1}
.dtag-new{background:var(--accent);color:var(--accent-ink)} .dtag-chg{background:var(--chg);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding:6px 7px 7px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 6px 1px 5px;border-radius:4px;background:var(--surface2);border:1px solid var(--line2);cursor:grab;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--jc,var(--muted));flex:none}
.chip.j-s{--jc:var(--j-sales)} .chip.j-o{--jc:var(--j-office)} .chip.j-r{--jc:var(--j-rnd)} .chip.j-t{--jc:var(--j-tech)}
.chip.head{font-weight:700;border-color:var(--line)}
.chip.vac{border-style:dashed;border-color:var(--muted);color:var(--muted);background:transparent}
.chip.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.moved{box-shadow:inset 0 -2px 0 var(--chg)}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.mk{font-size:10px;color:var(--accent)}
.chip.mv{border-color:var(--chg);background:var(--chg-soft)}
.chip.vac,.chip.vac.mv,.chip.vac.head{border:1.5px dashed var(--muted);background:transparent;color:var(--muted)}
.chip.vac.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mvk{font-size:11px;color:var(--chg);font-weight:700}
.mvlist{font-size:12.5px;margin:2px 0 6px}
.mvlist b{color:var(--chg)}
body.viewer #scen,body.viewer #sname,body.viewer #b-dup,body.viewer #b-new,body.viewer #b-del,body.viewer #b-undo,body.viewer #b-redo,body.viewer #b-exp,body.viewer #b-imp,body.viewer #b-pub,body.viewer .sep,body.viewer #tray,body.viewer .tab[data-tab="edit"]{display:none}
#vtitle{font-weight:600;font-size:14px}
body.ro #b-dup,body.ro #b-new,body.ro #b-del,body.ro #b-imp,body.ro #b-hr,body.ro #b-undo,body.ro #b-redo,body.ro #tray{display:none}
body.viewer .lg-review{display:none}
#vtitle small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
.pubinfo{background:var(--surface2);border-radius:6px;padding:8px 10px;font-size:12.5px}
.inl{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--accent);border-radius:3px;padding:0 3px;margin:-1px 0;min-width:0;max-width:100%;box-sizing:border-box;outline:none}
.u-name,.u-head{cursor:text}
.chip.hit .mk{color:inherit}
.tray{border-top:1px solid var(--line2);background:var(--surface);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;max-height:120px;overflow:auto}
.tray.dz-into{background:var(--accent-soft)}
.tray-label{font-weight:600;margin-right:6px}
.tray-hint{color:var(--muted);font-size:12px}
.zoom{position:sticky;left:0}
aside{border-left:1px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line2)}
.tab{flex:1;border:0;background:transparent;padding:9px 0;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.pane{flex:1;overflow:auto;padding:14px 16px 24px;min-height:0}
.pane h3{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane h4{font-size:12px;color:var(--muted);font-weight:600;margin:16px 0 6px;letter-spacing:.02em}
.fld{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:7px}
.fld>label{color:var(--muted);font-size:12px}
.fld select,.fld input{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>input,.row>select{flex:1;min-width:0}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;white-space:nowrap}
.fld .checks input[type=checkbox]{width:auto;margin:0;flex:none}
.help{color:var(--muted);font-size:12.5px;line-height:1.6}
.help ol{padding-left:18px;margin:6px 0}
.help li{margin-bottom:5px}
.help b{color:var(--ink)}
.dlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.dlist li{padding:5px 8px;border-radius:4px;background:var(--surface2);font-size:12.5px;border-left:3px solid var(--line)}
.dlist li.k-new{border-left-color:var(--accent)} .dlist li.k-chg{border-left-color:var(--chg)} .dlist li.k-del{border-left-color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.dlist li.k-mv{border-left-color:var(--j-sales)} .dlist li.k-add{border-left-color:var(--ok)} .dlist li.k-rm{border-left-color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
tr.l1 td{font-weight:700;background:var(--surface2)}
.empty{max-width:420px;margin:60px auto;text-align:center;padding:0 16px}
.empty h2{font-size:17px;margin:0 0 8px}
.empty p{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--surface);border-radius:8px;padding:16px;width:min(520px,100%);display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto}
.modal textarea{width:100%;min-height:160px;font-family:var(--f-num);font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:12.5px;z-index:30;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.mini{font-size:12px}
@media (max-width:900px){
  .app{height:auto}
  main{display:block}
  .canvas{height:66vh}
  aside{border-left:0;border-top:1px solid var(--line2)}
  .pane{overflow:visible}
  .status{margin-left:0;width:100%}
  .legend{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand">조직 운영계획</div>
    <a class="btn" id="b-hc" href="./headcount.html" style="text-decoration:none;color:inherit">고용증가율</a>
    <span id="vtitle" hidden></span>
    <button class="btn primary" id="b-endprev" hidden>미리보기 끝내기</button>
    <button class="btn primary" id="b-endpresent" hidden>회의 보기 끝내기</button>
    <div class="grp">
      <select id="scen" aria-label="조직안 선택"></select>
      <input id="sname" aria-label="조직안 이름" placeholder="조직안 이름">
      <button class="btn" id="b-dup" title="지금 보고 있는 안을 복사해 새 안으로 추가합니다">추가</button>
      <button class="btn" id="b-new" title="대표이사만 있는 빈 조직도를 새로 만듭니다">새 조직도</button>
      <button class="btn" id="b-del" title="지금 보고 있는 안을 삭제합니다">삭제</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="btn" id="b-undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶</button>
      <button class="btn" id="b-redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행">↷</button>
      <button class="btn on" id="b-people">인원 표시</button>
      <button class="btn" id="b-rankshow">직급 표시</button>
      <button class="btn" id="b-present" title="도구와 오른쪽 칸을 숨기고 조직도만 크게 봅니다 (Esc로 끝내기)">회의 보기</button>
      <button class="btn on" id="b-moves" title="비교 기준안과 소속이 다른 사람을 ↔로 표시합니다">이동자 표시</button>
      <button class="btn" id="b-cmp">비교 표시</button>
      <button class="btn sm" id="b-zo" aria-label="축소">－</button><span id="zv" class="mini muted">100%</span><button class="btn sm" id="b-zi" aria-label="확대">＋</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <input id="q" placeholder="이름 찾기" aria-label="이름 찾기" style="width:110px">
      <button class="btn" id="b-exp">내보내기</button>
      <button class="btn" id="b-imp">가져오기</button>
      <button class="btn" id="b-hr">인사정보 넣기</button>
      <button class="btn primary" id="b-pub" hidden>경영진 공개</button>
      <button class="btn" id="b-theme" type="button"></button><button class="btn" id="b-logout" hidden>로그아웃</button>
    </div>
    <span class="status" id="status" aria-live="polite">불러오는 중…</span>
  </header>
  <div class="strip">
    <span class="sumline" id="sumline">—</span>
    <button class="btn sm" id="b-copysum" title="PPT 상단 문구로 붙여넣기">문구 복사</button>
    <span class="facts" id="facts"></span>
    <span class="legend">
      <span class="lg"><i class="sw band"></i>부/실 조직</span>
      <span class="lg"><i class="sw chg"></i>변경 조직</span>
      <span class="lg"><i class="sw new"></i>신설 조직</span>
      <span class="lg"><i class="sw out"></i>외주</span>
      <span class="lg"><b class="mk">▲</b>승진</span>
      <span class="lg"><b class="mk">●</b>신규선임</span>
      <span class="lg lg-review"><b class="mk">■</b>승진심사대상</span>
      <span class="lg"><b class="mvk">↔</b>부서이동</span>
    </span>
  </div>
  <main>
    <section class="canvas">
      <div class="scroll" id="scroll"><div class="empty"><p>불러오는 중…</p></div></div>
      <div class="tray" id="tray" data-tray="1"></div>
    </section>
    <aside>
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="diff" role="tab">변경사항</button>
        <button class="tab" data-tab="table" role="tab">요약표</button>
      </div>

<script>
(function(){

const BIG = new Set(["사업부","본부","실","연구실","연구소","공장","대표"]);

const S = {present:false, showRank:false, view:false, preview:false, pub:null, pubOwn:null, noAccess:false, scen:{}, cur:null, base:null, sel:null, tab:"diff", showPeople:true, showMoves:true, compare:false, q:"", zoom:1, mode:"loading", readOnly:false};
const hist = {};
let col = null, downloads = null, firstSnap = true, pubRef = null, roSaved = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

const pref = Object.assign({}, lsGet(PREFKEY) || {});
function savePref(){ pref.cur = S.cur; pref.base = S.base; pref.showPeople = S.showPeople; (isNowScen(S.cur) ? 0 : (pref.showMoves = S.showMoves)); pref.showRank = S.showRank; pref.zoom = S.zoom; lsSet(PREFKEY, pref); }

/* ---------- model helpers ---------- */
const D = () => S.view ? (S.pub && S.pub.data) : (S.scen[S.cur] && S.scen[S.cur].data);
const um = d => { const m = {}; d.units.forEach(u => m[u.id] = u); return m; };

function subtree(d, id){ const out = [id]; for (let i = 0; i < out.length; i++) d.units.forEach(u => { if (u.parent === out[i]) out.push(u.id); }); return out; }

function depth(d, u){ let k = 0, m = um(d); while (u && u.parent != null) { k++; u = m[u.parent]; } return k; }
function marks(p){ return FLAGS.filter(f => (p.flags||[]).includes(f[0])).map(f => f[1]).join(""); }

}
function unitName(d, id){ if (!id) return "미배치"; const u = d.units.find(x => x.id === id); return u ? u.name : "(삭제된 조직)"; }
function summary(d){

  d.units.forEach(u => { if (u !== r) c[u.type] = (c[u.type]||0) + 1; });
  const parts = SUMORDER.filter(t => c[t]).map(t => c[t] + t);
  Object.keys(c).forEach(t => { if (!SUMORDER.includes(t)) parts.push(c[t] + t); });

function blankData(){ return {statusAuto:1, units:[{id:"root",name:"대표이사",type:"대표",status:"",parent:null,order:0,headId:null,headText:"",note:""}], people:[]}; }

/* ---------- history & save ---------- */
function H(id){ return hist[id] || (hist[id] = {u:[], r:[], key:null, t:0}); }
function mutate(fn, key, opts){
  if (S.readOnly) { toast("보기 전용으로 열려 있어 수정할 수 없습니다."); return; }
  const d = D(); if (!d) return;
  const h = H(S.cur), now = Date.now();
  if (!(key && h.key === key && now - h.t < 1500)) { h.u.push(JSON.stringify(d)); if (h.u.length > 80) h.u.shift(); h.r = []; }

}
function undo(){ if (S.view) return; const h = H(S.cur); if (!h.u.length) return; h.r.push(JSON.stringify(D())); S.scen[S.cur].data = JSON.parse(h.u.pop()); h.key = null; fixSel(); markDirty(S.cur); render({}); }

function fixSel(){ const d = D(); if (!S.sel || !d) return; const ok = S.sel.k === "u" ? d.units.some(u => u.id === S.sel.id) : d.people.some(p => p.id === S.sel.id); if (!ok) S.sel = null; }

}
async function flush(id){

    else if (e && e.code === "quota_exceeded") setStatus("저장 공간이 가득 찼습니다. 쓰지 않는 안을 지워 주세요.", true);
    else if (e && e.code === "unauthenticated") { dirty.add(id); setStatus("로그인이 만료되었습니다. 다시 로그인하면 저장됩니다.", true); if (typeof showLogin === "function") showLogin("로그인이 만료되었습니다. 다시 로그인해 주세요."); }

}
function saveLocal(){ lsSet(LSKEY, S.scen); }
function idleStatus(){ setStatus(S.mode === "db" ? "저장됨" : "이 브라우저에만 저장됩니다 (내보내기로 백업하세요)"); }
function setStatus(t, err){ const el = $("#status"); el.textContent = t; el.classList.toggle("err", !!err); }
let toastT; function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200); }

/* ---------- scenarios ---------- */
function scenList(){ return Object.entries(S.scen).sort((a,b) => (a[1].order??0) - (b[1].order??0) || (a[1].updatedAt||0) - (b[1].updatedAt||0)); }
function nextOrder(){ return Math.max(-1, ...Object.values(S.scen).map(s => s.order ?? 0)) + 1; }
function addScenario(name, data, note){
  const id = uid("s");
  S.scen[id] = {name, note: note || "", order: nextOrder(), updatedAt: Date.now(), data: normalize(data)};
  const nb = nowBaseId(id); if (nb && nb !== id) S.base = nb; else if (S.cur && S.cur !== id) S.base = S.cur;
  S.cur = id; S.sel = null; markDirty(id); savePref(); render({});
  return id;
}
async function deleteScenario(id){
  delete S.scen[id]; dirty.delete(id); clearTimeout(timers[id]);
  if (S.mode === "db") { try { await col.doc(id).delete(); } catch(e){ setStatus("삭제하지 못했습니다.", true); } } else saveLocal();

  S.sel = null; savePref(); render({});
}
function isNowScen(id){ const sc = S.scen[id]; return !!sc && /현행/.test(sc.name || ""); }
function pickDefaults(){
  const l = scenList();
  if (!S.scen[S.cur]) S.cur = (pref.cur && S.scen[pref.cur]) ? pref.cur : (l.length ? l[l.length-1][0] : null);
  if (!S.scen[S.base] || S.base === S.cur) S.base = (pref.base && S.scen[pref.base] && pref.base !== S.cur) ? pref.base : ((l.find(x => x[0] !== S.cur) || [null])[0]);
}

/* ---------- diff ---------- */
function linkPeople(B, C){
  const bp = pm(B), cp = pm(C), c2b = {}, b2c = {};
  const k = p => String(p.name || "").replace(/\(.*?\)/g, "").replace(/\s/g, "");
  C.people.forEach(p => { if (bp[p.id]) { c2b[p.id] = bp[p.id]; b2c[p.id] = p; } });
  const restB = {}, dupB = new Set();
  B.people.forEach(b => { if (cp[b.id] || b.vacant) return; const key = k(b); if (restB[key]) dupB.add(key); restB[key] = b; });
  const usedC = {};

  Object.entries(usedC).forEach(([key, p]) => { if (dupB.has(key)) return; const b = restB[key]; c2b[p.id] = b; b2c[b.id] = p; });
  return {c2b, b2c};
}
function computeDiff(B, C){
  const bu = um(B), cu = um(C), bp = pm(B), cp = pm(C);
  const r = {units:[], people:[], tag:{}, moved:new Set(), from:{}, rows:[]};
  const lk = linkPeople(B, C);
  C.units.forEach(u => {
    const b = bu[u.id];
    if (!b) { r.units.push({k:"new", t:"신설 · " + u.name + " (" + unitName(C, u.parent) + " 아래)"}); r.tag[u.id] = {k:"new", t:"신설"}; return; }
    const ch = [];
    if (b.name !== u.name) ch.push("명칭 " + b.name + " → " + u.name);
    if (b.parent !== u.parent) ch.push("상위 " + unitName(B, b.parent) + " → " + unitName(C, u.parent));
    if (b.type !== u.type) ch.push("유형 " + b.type + " → " + u.type);
    const bh = headLabel(B, b), chh = headLabel(C, u), sameHead = u.headId && b.headId && lk.c2b[u.headId] && lk.c2b[u.headId].id === b.headId; if (!sameHead && bh !== chh) ch.push("조직장 " + bh + " → " + chh);
    const structural = b.name !== u.name || b.parent !== u.parent || b.type !== u.type;
    if (ch.length) { r.units.push({k:"chg", t:u.name + " · " + ch.join(" / ")}); if (structural) r.tag[u.id] = {k:"chg", t:"변경"}; }
  });
  B.units.forEach(b => { if (!cu[b.id]) r.units.push({k:"del", t:"폐지 · " + b.name}); });
  C.people.forEach(p => {
    const b = lk.c2b[p.id];
    if (!b) { r.people.push({k:"add", t:(p.vacant ? "채용예정 추가" : "추가") + " · " + pname(p) + " → " + unitName(C, p.unit)}); r.moved.add(p.id); return; }
    if (b.unit !== p.unit) { r.people.push({k:"mv", t:pname(p) + " · " + unitName(B, b.unit) + " → " + unitName(C, p.unit)}); r.moved.add(p.id); if (b.unit && p.unit) r.from[p.id] = unitName(B, b.unit); }
  });
  B.people.forEach(b => { if (!lk.b2c[b.id]) r.people.push({k:"rm", t:"제외 · " + pname(b) + " (" + unitName(B, b.unit) + ")"}); });
  const bR = rootOf(B), cR = rootOf(C);
  const ids = []; kids(B, bR.id).forEach(u => ids.push(u.id)); kids(C, cR.id).forEach(u => { if (!ids.includes(u.id)) ids.push(u.id); });
  ids.forEach(id => r.rows.push({name: cu[id] ? cu[id].name : bu[id].name, b: bu[id] ? count(B, id).n : null, c: cu[id] ? count(C, id).n : null}));

}
function diffNow(){ if (S.view) return S.pub && S.pub.diff ? Object.assign({moved:new Set(), tag:{}, from:{}, units:[], people:[], rows:[]}, S.pub.diff) : null; const b = S.scen[S.base], c = S.scen[S.cur]; return b && c && S.base !== S.cur ? computeDiff(b.data, c.data) : null; }

/* ---------- render ---------- */
const scPre = id => { const m = /^\s*(\[[^\]]*\])/.exec((S.scen[id] || {}).name || ""); return m ? m[1] : ""; };
function nowBaseId(forId){ const pre = scPre(forId || S.cur), l = scenList().filter(([id]) => isNowScen(id)), same = l.filter(([id]) => scPre(id) === pre); const r = same.length ? same : l; return r.length ? r[0][0] : null; }
let AUTO = {};
function calcAuto(d){

  try { const t = computeDiff(S.scen[bid].data, d).tag; Object.keys(t).forEach(id => AUTO[id] = t[id].k === "new" ? "신설" : "변경"); } catch (e) {}
}
function effStatus(u){ return u.status === "기존" ? "" : (u.status || AUTO[u.id] || ""); }
function render(o){
  o = o || {};

  if (!S.view && S.cur !== S.lastCur) { S.lastCur = S.cur; S.showMoves = !isNowScen(S.cur); }
  renderHeader();
  const d = D();
  if (!d) { renderEmpty(); return; }
  calcAuto(d);
  const diff = diffNow();
  renderStrip(d, diff);
  if (!o.keepChart) renderChart(d, diff);
  if (!o.keepTray) renderTray(d, diff);
  if (!o.keepPanel) renderPane(d, diff);
}
function renderHeader(){
  const l = scenList(), sel = $("#scen");
  sel.innerHTML = l.map(([id, s]) => `<option value="${id}"${id === S.cur ? " selected" : ""}>${esc(s.name || "이름 없는 안")}</option>`).join("") || `<option>조직안 없음</option>`;
  const nm = $("#sname"); if (document.activeElement !== nm) nm.value = S.scen[S.cur] ? S.scen[S.cur].name : "";
  const has = S.view ? !!S.pub : !!S.scen[S.cur];
  const vt = $("#vtitle"); vt.hidden = !(S.view || S.present);
  vt.innerHTML = S.view && S.pub ? esc(S.pub.name) + `<small>${fmtDate(S.pub.publishedAt)} 공개본 · 보기 전용</small>` : (S.present && S.scen[S.cur] ? esc(S.scen[S.cur].name) : "");
  $("#b-endpresent").hidden = !S.present; document.body.classList.toggle("present", S.present);
  $("#b-rankshow").classList.toggle("on", S.showRank);
  $("#b-endprev").hidden = !(S.view && S.preview);
  document.body.classList.toggle("viewer", S.view);
  ["#sname","#b-dup","#b-del","#b-exp","#b-pub","#b-people","#b-moves","#b-cmp","#q"].forEach(s => $(s).disabled = !has);
  $("#b-moves").classList.toggle("on", S.showMoves);
  const h = H(S.cur); $("#b-undo").disabled = !h.u.length; $("#b-redo").disabled = !h.r.length;

function renderEmpty(){
  if (S.view) {
    $("#sumline").textContent = "—"; $("#facts").innerHTML = ""; $("#pane").innerHTML = "";
    $("#scroll").innerHTML = `<div class="empty"><h2>${S.mode === "loading" ? "불러오는 중…" : S.noAccess ? "이 링크로는 조직도를 볼 수 없습니다" : "아직 공개된 조직도가 없습니다"}</h2><p>${S.noAccess ? "Claude에 로그인한 뒤 다시 열어 주세요." : ""}</p></div>`;
    return;
  }
  $("#sumline").textContent = "—"; $("#facts").innerHTML = ""; $("#tray").innerHTML = "";
  $("#scroll").innerHTML = S.mode === "loading" ? `<div class="empty"><p>불러오는 중…</p></div>` :
    `<div class="empty"><h2>저장된 조직안이 없습니다</h2><p>빈 조직도에서 시작하거나, 이전에 내보낸 JSON 파일을 가져오세요.</p>
     <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-act="start-blank">빈 조직도로 시작</button><button class="btn" data-act="open-import">JSON 가져오기</button></div></div>`;
  $("#pane").innerHTML = helpHtml();
}
function renderStrip(d, diff){
  $("#sumline").textContent = summary(d);
  const all = d.people, assigned = all.filter(p => p.unit), vac = assigned.filter(p => p.vacant).length, un = all.filter(p => !p.unit).length;
  const jc = {}; assigned.forEach(p => jc[p.job] = (jc[p.job]||0) + 1);
  let h = `<span>현원 <b>${assigned.length - vac}</b></span><span>채용예정 <b>${vac}</b></span>` + (un ? `<span>미배치 <b>${un}</b></span>` : "");
  h += `<span>${JOBS.map(j => j + " <b>" + (jc[j]||0) + "</b>").join(" · ")}</span>`;
  const mvSet = new Set(assigned.filter(p => p.flags.includes("move")).map(p => p.id));

  const none = ppl => ppl.filter(p => !p.vacant && !(p.rank || "").trim()).length;

  const cell = n => `<td class="n">${n || ""}</td>`;
  const row = (name, ppl, cls) => `<tr${cls ? ` class="${cls}"` : ""}><td>${esc(name)}</td>${cols.map(r => cell(cnt(ppl, r))).join("")}${cell(none(ppl))}${cell(vac(ppl))}<td class="n">${ppl.length}</td></tr>`;
  const tot = all.length || 1, exec = all.filter(p => !p.vacant && rankLv(p.rank) >= rankLv("이사")).length;
  const pct = n => Math.round(n / tot * 1000) / 10 + "%";
  return `<h4>조직별 직급 구성</h4><div class="tblwrap"><table class="comp"><thead><tr><th>조직</th>${cols.map(r => `<th class="n">${esc(r)}</th>`).join("")}<th class="n">미입력</th><th class="n">채용예정</th><th class="n">계</th></tr></thead><tbody>` +
    groups.map(g => row(g.name, g.ppl)).join("") + row("합계", all, "l1") +
    `<tr><td class="muted">비율</td>${cols.map(r => `<td class="n muted">${pct(cnt(all, r))}</td>`).join("")}<td class="n muted">${pct(none(all))}</td><td class="n muted">${pct(vac(all))}</td><td class="n muted">100%</td></tr></tbody></table></div>
    <p class="muted mini">임원(이사 이상) ${exec}명 · ${pct(exec)} · 미배치 인원은 빠집니다.</p>`;
}

function startEdit(el, init, commit, allowEmpty){
  if (el.querySelector(".inl")) return;
  el.closest("[draggable]") && el.closest("[draggable]").setAttribute("draggable", "false");
  const unitEl = el.closest(".unit"); unitEl && unitEl.setAttribute("draggable", "false");
  const inp = document.createElement("input"); inp.className = "inl"; inp.value = init;
  inp.size = Math.max(4, init.length + 2); inp.setAttribute("aria-label", "바로 수정");
  el.textContent = ""; el.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (ok && v !== init && (v || allowEmpty)) commit(v); else render({keepPanel:true});
  };
  inp.addEventListener("keydown", ev => { ev.stopPropagation(); if (ev.key === "Enter") { ev.preventDefault(); finish(true); } else if (ev.key === "Escape") { ev.preventDefault(); finish(false); } });
  inp.addEventListener("blur", () => finish(true));
  inp.addEventListener("input", () => { inp.size = Math.max(4, inp.value.length + 2); });
  ["click", "dblclick", "mousedown"].forEach(t => inp.addEventListener(t, ev => ev.stopPropagation()));
}
function inferType(name, cur){
  if (cur === "대표") return cur;
  const n = String(name || "").trim();
  if (/사업부$/.test(n)) return "사업부";
  if (/본부$/.test(n)) return "본부";
  if (/연구소$/.test(n)) return "연구소";
  if (/연구실$/.test(n)) return "연구실";
  if (/공장$/.test(n)) return "공장";
  if (/(part|파트)$/i.test(n)) return "파트";
  if (/팀$/.test(n)) return "팀";
  if (/실$/.test(n)) return "실";
  return cur;
}
function renameUnit(d, id, name){ const x = d.units.find(y => y.id === id); x.name = name; x.type = inferType(name, x.type); return x; }
function editUnitName(el){
  const d = D(), u = d.units.find(x => x.id === el.closest(".unit").dataset.uid);

}
function editHead(el){
  const d = D(), u = d.units.find(x => x.id === el.closest(".unit").dataset.uid);
  const p = u.headId && d.people.find(x => x.id === u.headId);
  if (p) {

      if (!tk.length) return;

      else { x.name = tk.pop(); x.rank = tk.join(" "); x.vacant = false; }
    }));

function moveUnit(d, id, targetId, pos){
  const u = d.units.find(x => x.id === id), t = d.units.find(x => x.id === targetId);
  if (pos === "into") { u.parent = t.id; u.order = Math.max(-1, ...kids(d, t.id).filter(x => x !== u).map(x => x.order)) + 1; return; }
  const sib = kids(d, t.parent).filter(x => x !== u); const i = sib.indexOf(t) + (pos === "after" ? 1 : 0);
  sib.splice(i, 0, u); u.parent = t.parent; sib.forEach((x, k) => x.order = k);
}
function movePerson(d, pid, unitId){
  const p = d.people.find(x => x.id === pid); if (!p || p.unit === unitId) return;
  const was = d.units.filter(u => u.headId === pid && u.id === p.unit);
  p.unit = unitId || null;
  if (!unitId) { d.units.forEach(u => { if (u.headId === pid) u.headId = null; }); return pname(p) + "님을 미배치로 옮겼습니다."; }
  if (was.length) return pname(p) + "님은 아직 " + was.map(u => u.name).join(", ") + " 조직장입니다 (겸직으로 표시).";
}
function deleteUnit(d, id){
  const u = d.units.find(x => x.id === id);
  kids(d, id).forEach(k => { k.parent = u.parent; k.order = 999 + k.order; });
  d.people.forEach(p => { if (p.unit === id) p.unit = null; });
  d.units = d.units.filter(x => x !== u);
  kids(d, u.parent).forEach((x, i) => x.order = i);
}

function handleAct(act, el){

  switch (act) {

    case "start-blank": addScenario("새 조직안", blankData()); break;
    case "open-import": openImport(); break;
    case "ord": { const dir = +el.dataset.d; mutate(d => { const sib = kids(d, sel.parent); const i = sib.findIndex(x => x.id === sel.id), j = i + dir; if (j < 0 || j >= sib.length) return; [sib[i], sib[j]] = [sib[j], sib[i]]; sib.forEach((x, k) => x.order = k); }); break; }

    case "cadd": { const name = ($("#f-cnew").value || "").trim() || "새 팀"; const id = uid("u-"); mutate(d => { d.units.push({id, name, type: inferType(name, "팀"), status:"", parent: sel.id, order: kids(d, sel.id).length, headId:null, headText:"", note:""}); }); S.sel = {k:"u", id}; render({}); break; }
    case "merge": { const t = $("#f-merge").value; if (!t) { toast("통합할 조직을 먼저 고르세요."); return; } const tn = unitName(d, t), sn = sel.name;
      mutate(d => { d.people.forEach(p => { if (p.unit === sel.id) p.unit = t; }); kids(d, sel.id).forEach(k => { k.parent = t; k.order = 999 + k.order; }); kids(d, t).forEach((x,i) => x.order = i); d.units = d.units.filter(x => x.id !== sel.id); kids(d, sel.parent).forEach((x,i) => x.order = i); return sn + "을(를) " + tn + "(으)로 통합했습니다."; });
      S.sel = {k:"u", id:t}; render({}); break; }
    case "udel": if (!arm(el, "udel", "한 번 더 누르면 삭제")) return; mutate(d => { deleteUnit(d, sel.id); }); S.sel = null; render({}); toast("조직을 삭제했습니다. 되돌리기로 복구할 수 있습니다."); break;
    case "pdel": if (!arm(el, "pdel", "한 번 더 누르면 삭제")) return; mutate(d => { d.units.forEach(u => { if (u.headId === sel.id) u.headId = null; }); d.people = d.people.filter(p => p.id !== sel.id); }); S.sel = null; render({}); break;

function copy(text, msg){

/* ---------- drag & drop ---------- */
let drag = null, dz = null;
function clearDz(){ if (dz) { dz.el.classList.remove("dz-into","dz-before","dz-after"); dz = null; } }
document.addEventListener("dragstart", e => {
  if (S.readOnly) { e.preventDefault(); return; }
  const c = e.target.closest && e.target.closest("[data-pid]");
  if (c) { drag = {k:"p", id:c.dataset.pid}; }
  else { const u = e.target.closest && e.target.closest(".unit[data-uid]"); if (!u || u.classList.contains("lv-root")) { e.preventDefault(); return; } drag = {k:"u", id:u.dataset.uid}; }
  try { e.dataTransfer.setData("text/plain", drag.id); e.dataTransfer.effectAllowed = "move"; } catch (x) {}
});
function dropTarget(e){
  const d = D(); if (!drag || !d) return null;
  const tray = e.target.closest("#tray");
  if (tray) return drag.k === "p" ? {el: tray, pos:"tray"} : null;
  const el = e.target.closest("#scroll .unit[data-uid], #pane .unit[data-uid]"); if (!el) return null;
  const tid = el.dataset.uid;
  if (drag.k === "p") return {el, id: tid, pos:"into"};
  if (tid === drag.id || subtree(d, drag.id).includes(tid)) return null;
  if (el.classList.contains("lv-root")) return {el, id: tid, pos:"into"};
  const r = el.getBoundingClientRect(); let pos = "into";
  if (el.classList.contains("lv-div") || el.classList.contains("l1")) { const x = e.clientX - r.left; if (x < r.width * .22) pos = "before"; else if (x > r.width * .78) pos = "after"; }
  else { const y = e.clientY - r.top, edge = Math.min(14, r.height * .3); if (y < edge) pos = "before"; else if (y > r.height - edge) pos = "after"; }
  return {el, id: tid, pos};
}
document.addEventListener("dragover", e => {
  const t = dropTarget(e);
  if (!t) { clearDz(); return; }
  e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (x) {}
  const cls = t.pos === "tray" ? "dz-into" : "dz-" + t.pos;
  if (dz && dz.el === t.el && dz.cls === cls) return;
  clearDz(); t.el.classList.add(cls); dz = {el: t.el, cls};
});
document.addEventListener("drop", e => {
  const t = dropTarget(e); clearDz();
  if (!t) return; e.preventDefault();
  const dr = drag; drag = null;
  if (dr.k === "p") mutate(d => movePerson(d, dr.id, t.pos === "tray" ? null : t.id));
  else mutate(d => { moveUnit(d, dr.id, t.id, t.pos); });
});
document.addEventListener("dragend", () => { drag = null; clearDz(); });
