  --chg:#a05f00; --chg-soft:#fff1d6; --out:#6b7280;
  --j-sales:#2f5fd0; --j-office:#6b7488; --j-rnd:#0f8a7e; --j-tech:#c47a00;
  --ok:#1f7a4d; --warn:#b54708;

}

  --accent:#ff4f8e; --accent-soft:#3b1828; --accent-ink:#1a0710;
  --chg:#f0b041; --chg-soft:#3a2c10; --out:#9aa3b3;
  --j-sales:#7aa2ff; --j-office:#a3abbd; --j-rnd:#4fd1c0; --j-tech:#f0b041;
  --ok:#5ad39a; --warn:#f6a35b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1a1f28; --surface2:#151920; --ink:#e6e9ef; --muted:#9aa3b3; --line:#3d4555; --line2:#2a303c;

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

<script>
// 고용증가율 계산 엔진 (화면에도 그대로 들어감)
const HC = (() => {
  const pad = n => String(n).padStart(2, "0");
  const addM = (k, n) => { let [y, m] = k.split("-").map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + "-" + pad(m); };
  const lastDay = k => { const [y, m] = k.split("-").map(Number); return k + "-" + pad(new Date(y, m, 0).getDate()); };
  const monthOf = d => String(d).slice(0, 7);
  const range = (a, b) => { const o = []; for (let k = a; k <= b; k = addM(k, 1)) o.push(k); return o; };
  function count(d, k){
    if (k < d.startMonth) return null;
    if (k < d.baseMonth) return d.actual[k] ?? null;
    if (k === d.baseMonth) return d.baseCount;
    const baseEnd = lastDay(d.baseMonth), kEnd = lastDay(k);
    let n = d.baseCount;
    Object.entries(d.adjust || {}).forEach(([m, v]) => { if (m > d.baseMonth && m <= k) n += +v || 0; });
    (d.events || []).forEach(e => {
      if (!e.date) return;
      if (e.type === "in" && e.date > baseEnd && e.date <= kEnd) n += 1;
      if (e.type === "out" && e.date >= baseEnd && e.date < kEnd) n -= 1;
    });
    return n;
  }
  function calc(d){
    const months = range(d.startMonth, d.endMonth), cnt = {}, avg = {}, rate = {};
    months.forEach(k => cnt[k] = count(d, k));
    months.forEach(k => {
      const prev = []; for (let i = 1; i <= d.window; i++) { const p = addM(k, -i); if (p >= d.startMonth && cnt[p] != null) prev.push(cnt[p]); }
      avg[k] = prev.length ? prev.reduce((a, b) => a + b, 0) / prev.length : cnt[k];
    });
    months.forEach(k => {
      if (avg[k] == null) { rate[k] = null; return; }
      if (k <= d.specialUntil) { rate[k] = (avg[k] - d.specialBase) / d.specialBase; return; }
      const p = addM(k, -12), pa = avg[p];
      rate[k] = pa ? (avg[k] - pa) / pa : null;
    });
    return {months, cnt, avg, rate};
  }
  return {addM, lastDay, monthOf, range, count, calc};
})();
if (typeof module !== "undefined") module.exports = HC;

function parseBulk(text){
  const out = [], bad = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    const t = line.trim(); if (!t) return;
    const tok = t.split(/\t|,|\s+/).map(x => x.trim()).filter(Boolean);
    let type = null, date = null, loss = false; const nm = [];
    tok.forEach(x => {
      if (/^(입사|in|취득)$/i.test(x)) { type = "in"; return; }
      if (/^(퇴사|out)$/i.test(x)) { type = "out"; return; }
      if (/^상실$/.test(x)) { type = "out"; loss = true; return; }
      let m = x.match(/^(\d{4})[.\-\/]?(\d{1,2})[.\-\/]?(\d{1,2})?\.?$/);
      if (m && +m[2] >= 1 && +m[2] <= 12 && !(m[3] && (+m[3] < 1 || +m[3] > 31)) && (x.length >= 6)) { const ymS = m[1] + "-" + String(m[2]).padStart(2, "0"); date = m[3] ? ymS + "-" + String(m[3]).padStart(2, "0") : ymS; return; }
      if (/^(이름|성명|구분|날짜|일자)$/.test(x)) return;
      nm.push(x);
    });
    if (!type || !date) { if (!/^(구분|이름|성명)/.test(t)) bad.push(t); return; }
    if (loss && date.length === 10) { const dt = new Date(date + "T00:00:00"); dt.setDate(dt.getDate() - 1); date = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
    out.push({type, name: nm.join(" "), date});
  });
  return {out, bad};
}

async function afterLogin(user){

  const {data: mem, error: me1} = await sb.from("org_members").select("role").eq("email", user.email).maybeSingle();
  if (me1) { setStatus("서버에 연결하지 못했습니다. 새로고침해 주세요.", true); return; }

  S.readOnly = mem.role !== "editor";
  const {data: rows, error} = await sb.from("hc_scenarios").select("*");
  if (error) { S.mode = "db"; render(); setStatus(/relation|does not exist|schema cache/i.test(error.message) ? "저장 표가 아직 없습니다. Supabase에서 설정 SQL을 실행해 주세요." : "자료를 불러오지 못했습니다.", true); return; }

  S.mode = "db"; const l = list();

}
